[workspace]
members = [
    "crates/pear-core",
    "crates/pear-macho",
    "crates/pear-objc",
    "crates/pear-nib",
    "crates/pear-gles",
    "crates/pear-metalkit",
    "crates/pear-uikit",
    "crates/pear-cxxcompat",
    "crates/pear-keychain",
    "crates/pear-empty-framework",
    "crates/pear-swift-support",
    "crates/pear-host-frameworks",
    "crates/pear-host",
    "crates/pear-host-macos",
    "crates/pear-image",
    "crates/pear-dyld",
    "crates/pear-libobjc",
    "crates/pear-foundation",
    "crates/pear-graphics",
    "crates/pear-host-linux",
    "crates/pear-runtime",
    "crates/pear-legacy-host",
]
# pear-swift-support targets aarch64-apple-ios-macabi for the UIKit Swift
# overlay; default host builds skip it.
default-members = [
    "crates/pear-core",
    "crates/pear-macho",
    "crates/pear-objc",
    "crates/pear-nib",
    "crates/pear-gles",
    "crates/pear-metalkit",
    "crates/pear-uikit",
    "crates/pear-keychain",
    "crates/pear-empty-framework",
    "crates/pear-host-frameworks",
    "crates/pear-host",
    "crates/pear-host-macos",
    "crates/pear-image",
    "crates/pear-dyld",
    "crates/pear-libobjc",
    "crates/pear-foundation",
    "crates/pear-graphics",
    "crates/pear-host-linux",
    "crates/pear-runtime",
    "crates/pear-legacy-host",
]
resolver = "2"

[profile.release]
opt-level = 2
lto = "thin"
