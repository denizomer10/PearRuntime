[workspace]
members = [
    "crates/pear-core",
    "crates/pear-macho",
    "crates/pear-objc",
    "crates/pear-nib",
    "crates/pear-gles",
    "crates/pear-metalkit",
    "crates/pear-uikit",
    "crates/pear-catalyst",
    "crates/pear-keychain",
]
# pear-catalyst targets Mac Catalyst only (build.sh); host builds skip it.
default-members = [
    "crates/pear-core",
    "crates/pear-macho",
    "crates/pear-objc",
    "crates/pear-nib",
    "crates/pear-gles",
    "crates/pear-metalkit",
    "crates/pear-uikit",
    "crates/pear-keychain",
]
resolver = "2"

[profile.release]
opt-level = 2
lto = "thin"
