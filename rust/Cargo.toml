[workspace]
members = [
    "crates/pear-core",
    "crates/pear-macho",
    "crates/pear-objc",
    "crates/pear-nib",
    "crates/pear-gles",
    "crates/pear-metalkit",
    "crates/pear-uikit",
    "crates/pear-catalyst",
    "crates/pear-opengles",
    "crates/pear-cxxcompat",
    "crates/pear-keychain",
    "crates/pear-empty-framework",
    "crates/pear-swift-support",
]
# pear-catalyst, pear-opengles, pear-cxxcompat and pear-swift-support target
# Mac Catalyst only
# (build.sh, build-angle-bridge.sh); host builds skip them.
default-members = [
    "crates/pear-core",
    "crates/pear-macho",
    "crates/pear-objc",
    "crates/pear-nib",
    "crates/pear-gles",
    "crates/pear-metalkit",
    "crates/pear-uikit",
    "crates/pear-keychain",
    "crates/pear-empty-framework",
]
resolver = "2"

[profile.release]
opt-level = 2
lto = "thin"

# Source-level smoke tests (scripts/build-smoke-runtime.sh): release code
# generation without LTO, built with the `smoke` feature of the crate tested.
[profile.smoke]
inherits = "release"
lto = false
incremental = true
