[workspace]
members = [
    "crates/pear-core",
    "crates/pear-macho",
    "crates/pear-objc",
    "crates/pear-nib",
    "crates/pear-gles",
    "crates/pear-metalkit",
    "crates/pear-uikit",
    "crates/pear-catalyst",
    "crates/pear-opengles",
    "crates/pear-cxxcompat",
    "crates/pear-keychain",
]
# pear-catalyst, pear-opengles and pear-cxxcompat target Mac Catalyst only
# (build.sh, build-angle-bridge.sh); host builds skip them.
default-members = [
    "crates/pear-core",
    "crates/pear-macho",
    "crates/pear-objc",
    "crates/pear-nib",
    "crates/pear-gles",
    "crates/pear-metalkit",
    "crates/pear-uikit",
    "crates/pear-keychain",
]
resolver = "2"

[profile.release]
opt-level = 2
lto = "thin"
