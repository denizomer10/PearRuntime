[package]
name = "pear-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
pear-macho = { path = "../pear-macho" }
pear-dyld = { path = "../pear-dyld" }
pear-libobjc = { path = "../pear-libobjc" }
pear-foundation = { path = "../pear-foundation" }
pear-host = { path = "../pear-host" }
pear-image = { path = "../pear-image" }
pear-graphics = { path = "../pear-graphics" }
pear-metal-vk = { path = "../pear-metal-vk" }
pear-swift-rt = { path = "../pear-swift-rt" }
pear-jit = { path = "../pear-jit" }
pear-legacy-host = { path = "../pear-legacy-host" }

[target.'cfg(target_os = "linux")'.dependencies]
pear-host-linux = { path = "../pear-host-linux" }

[[bin]]
name = "pear-run"
path = "src/bin/pear-run.rs"

[[bin]]
name = "pearruntime"
path = "src/bin/pear-run.rs"
