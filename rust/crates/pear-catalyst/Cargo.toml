[package]
name = "pear-catalyst"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PearRuntime Mac Catalyst in-process runtime (libPearRuntime.dylib)"

[lib]
name = "pear_catalyst"
# Built only for aarch64-apple-ios-macabi by build.sh (std from source) and
# force-loaded into libPearRuntime.dylib; it links against the app's UIKit.
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
pear-objc = { path = "../pear-objc" }
pear-keychain = { path = "../pear-keychain" }
